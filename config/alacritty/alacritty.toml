[general]
import = ["~/.local/state/theme/current/alacritty.toml"]

[font]
size = 15

[font.bold]
family = "IosevkaTerm Nerd Font"
style = "Bold"

[font.italic]
family = "IosevkaTerm Nerd Font"
style = "Italic"

[font.normal]
family = "IosevkaTerm Nerd Font"
style = "Regular"

[[keyboard.bindings]]
chars = "\u001F"
key = "Slash"
mods = "Control"

[[keyboard.bindings]]
chars = "\u001F"
key = "Slash"
mods = "Control|Shift"

[[keyboard.bindings]]
chars = "\u001B\r"
key = "Return"
mods = "Shift"

[window]
decorations = "none"
dynamic_padding = false

[window.padding]
x = 10
y = 5

[selection]
save_to_clipboard = true
