# Pop-up picker for menus such as networkmanager_dmenu (Mod+Shift+N).
# Colours come from the current theme variant (config/themes/<theme>/<variant>/
# fuzzel.ini), so fuzzel follows `theme set` and `theme toggle`.
[main]
include = ~/.local/state/theme/current/fuzzel.ini
font = IosevkaTerm Nerd Font:size=13
prompt = "> "
lines = 12
width = 50
horizontal-pad = 16
vertical-pad = 12

[border]
width = 2
radius = 12
