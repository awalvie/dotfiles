# Pop-up picker for menus such as networkmanager_dmenu (Mod+Shift+N).
# Rosé Pine Moon, like the which-key menu.
[main]
font = IosevkaTerm Nerd Font:size=13
prompt = "> "
lines = 12
width = 50
horizontal-pad = 16
vertical-pad = 12

[colors]
background = 232136f2
text = e0def4ff
prompt = c4a7e7ff
input = e0def4ff
match = f6c177ff
selection = 44415aff
selection-text = e0def4ff
selection-match = f6c177ff
border = c4a7e7ff

[border]
width = 2
radius = 12
