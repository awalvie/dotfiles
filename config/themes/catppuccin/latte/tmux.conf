# Catppuccin colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#8c8fa1,bg=default"
set -g status-left "#[fg=#8839ef]#[fg=#eff1f5,bg=#8839ef,bold] #{session_name} #[fg=#8839ef,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#04a5e5,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#eff1f5,bg=#04a5e5"
set -g message-style "fg=#eff1f5,bg=#04a5e5,fill=#04a5e5"
set -g message-command-style "fg=#eff1f5,bg=#04a5e5,fill=#04a5e5"
set -g pane-border-style "fg=#acb0be"
set -g pane-active-border-style "fg=#df8e1d"
