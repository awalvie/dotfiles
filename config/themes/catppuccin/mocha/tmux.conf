# Catppuccin colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#6c7086,bg=default"
set -g status-left "#[fg=#cba6f7]#[fg=#1e1e2e,bg=#cba6f7,bold] #{session_name} #[fg=#cba6f7,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#89dceb,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#1e1e2e,bg=#89dceb"
set -g message-style "fg=#1e1e2e,bg=#89dceb,fill=#89dceb"
set -g message-command-style "fg=#1e1e2e,bg=#89dceb,fill=#89dceb"
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#f9e2af"
