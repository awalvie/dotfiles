# Everforest colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#859289,bg=default"
set -g status-left "#[fg=#a7c080]#[fg=#2d353b,bg=#a7c080,bold] #{session_name} #[fg=#a7c080,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#83c092,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#2d353b,bg=#83c092"
set -g message-style "fg=#2d353b,bg=#83c092,fill=#83c092"
set -g message-command-style "fg=#2d353b,bg=#83c092,fill=#83c092"
set -g pane-border-style "fg=#56635f"
set -g pane-active-border-style "fg=#dbbc7f"
