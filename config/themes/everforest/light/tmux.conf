# Everforest colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#939f91,bg=default"
set -g status-left "#[fg=#8da101]#[fg=#fdf6e3,bg=#8da101,bold] #{session_name} #[fg=#8da101,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#35a77c,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#fdf6e3,bg=#35a77c"
set -g message-style "fg=#fdf6e3,bg=#35a77c,fill=#35a77c"
set -g message-command-style "fg=#fdf6e3,bg=#35a77c,fill=#35a77c"
set -g pane-border-style "fg=#bdc3af"
set -g pane-active-border-style "fg=#dfa000"
