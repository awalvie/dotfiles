# Flexoki colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#575653,bg=default"
set -g status-left "#[fg=#8b7ec8]#[fg=#100f0f,bg=#8b7ec8,bold] #{session_name} #[fg=#8b7ec8,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#3aa99f,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#100f0f,bg=#3aa99f"
set -g message-style "fg=#100f0f,bg=#3aa99f,fill=#3aa99f"
set -g message-command-style "fg=#100f0f,bg=#3aa99f,fill=#3aa99f"
set -g pane-border-style "fg=#403e3c"
set -g pane-active-border-style "fg=#d0a215"
