# Flexoki colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#b7b5ac,bg=default"
set -g status-left "#[fg=#5e409d]#[fg=#fffcf0,bg=#5e409d,bold] #{session_name} #[fg=#5e409d,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#24837b,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#fffcf0,bg=#24837b"
set -g message-style "fg=#fffcf0,bg=#24837b,fill=#24837b"
set -g message-command-style "fg=#fffcf0,bg=#24837b,fill=#24837b"
set -g pane-border-style "fg=#cecdc3"
set -g pane-active-border-style "fg=#ad8301"
