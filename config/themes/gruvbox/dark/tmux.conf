# Gruvbox colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#928374,bg=default"
set -g status-left "#[fg=#fe8019]#[fg=#282828,bg=#fe8019,bold] #{session_name} #[fg=#fe8019,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#8ec07c,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#282828,bg=#8ec07c"
set -g message-style "fg=#282828,bg=#8ec07c,fill=#8ec07c"
set -g message-command-style "fg=#282828,bg=#8ec07c,fill=#8ec07c"
set -g pane-border-style "fg=#665c54"
set -g pane-active-border-style "fg=#fabd2f"
