# Gruvbox colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#928374,bg=default"
set -g status-left "#[fg=#af3a03]#[fg=#fbf1c7,bg=#af3a03,bold] #{session_name} #[fg=#af3a03,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#427b58,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#fbf1c7,bg=#427b58"
set -g message-style "fg=#fbf1c7,bg=#427b58,fill=#427b58"
set -g message-command-style "fg=#fbf1c7,bg=#427b58,fill=#427b58"
set -g pane-border-style "fg=#bdae93"
set -g pane-active-border-style "fg=#b57614"
