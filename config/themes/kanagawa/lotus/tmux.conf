# Kanagawa colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#8a8980,bg=default"
set -g status-left "#[fg=#624c83]#[fg=#f2ecbc,bg=#624c83,bold] #{session_name} #[fg=#624c83,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#4d699b,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#f2ecbc,bg=#4d699b"
set -g message-style "fg=#f2ecbc,bg=#4d699b,fill=#4d699b"
set -g message-command-style "fg=#f2ecbc,bg=#4d699b,fill=#4d699b"
set -g pane-border-style "fg=#b8b5a0"
set -g pane-active-border-style "fg=#77713f"
