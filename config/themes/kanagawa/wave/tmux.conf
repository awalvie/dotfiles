# Kanagawa colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#727169,bg=default"
set -g status-left "#[fg=#957fb8]#[fg=#1f1f28,bg=#957fb8,bold] #{session_name} #[fg=#957fb8,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#7fb4ca,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#1f1f28,bg=#7fb4ca"
set -g message-style "fg=#1f1f28,bg=#7fb4ca,fill=#7fb4ca"
set -g message-command-style "fg=#1f1f28,bg=#7fb4ca,fill=#7fb4ca"
set -g pane-border-style "fg=#54546d"
set -g pane-active-border-style "fg=#e6c384"
