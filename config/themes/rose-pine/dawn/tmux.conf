# Rosé Pine colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#9893a5,bg=default"
set -g status-left "#[fg=#907aa9]#[fg=#faf4ed,bg=#907aa9,bold] #{session_name} #[fg=#907aa9,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#56949f,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#faf4ed,bg=#56949f"
set -g message-style "fg=#faf4ed,bg=#56949f,fill=#56949f"
set -g message-command-style "fg=#faf4ed,bg=#56949f,fill=#56949f"
set -g pane-border-style "fg=#cecacd"
set -g pane-active-border-style "fg=#ea9d34"
