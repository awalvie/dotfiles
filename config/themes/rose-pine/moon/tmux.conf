# Rosé Pine colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#6e6a86,bg=default"
set -g status-left "#[fg=#c4a7e7]#[fg=#232136,bg=#c4a7e7,bold] #{session_name} #[fg=#c4a7e7,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#9ccfd8,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#232136,bg=#9ccfd8"
set -g message-style "fg=#232136,bg=#9ccfd8,fill=#9ccfd8"
set -g message-command-style "fg=#232136,bg=#9ccfd8,fill=#9ccfd8"
set -g pane-border-style "fg=#56526e"
set -g pane-active-border-style "fg=#f6c177"
