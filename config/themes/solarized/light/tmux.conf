# Solarized colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#93a1a1,bg=default"
set -g status-left "#[fg=#6c71c4]#[fg=#fdf6e3,bg=#6c71c4,bold] #{session_name} #[fg=#6c71c4,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#2aa198,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#fdf6e3,bg=#2aa198"
set -g message-style "fg=#fdf6e3,bg=#2aa198,fill=#2aa198"
set -g message-command-style "fg=#fdf6e3,bg=#2aa198,fill=#2aa198"
set -g pane-border-style "fg=#93a1a1"
set -g pane-active-border-style "fg=#b58900"
