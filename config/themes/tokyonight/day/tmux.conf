# Tokyo Night colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#848cb5,bg=default"
set -g status-left "#[fg=#9854f1]#[fg=#e1e2e7,bg=#9854f1,bold] #{session_name} #[fg=#9854f1,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#007197,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#e1e2e7,bg=#007197"
set -g message-style "fg=#e1e2e7,bg=#007197,fill=#007197"
set -g message-command-style "fg=#e1e2e7,bg=#007197,fill=#007197"
set -g pane-border-style "fg=#a8aecb"
set -g pane-active-border-style "fg=#8c6c3e"
