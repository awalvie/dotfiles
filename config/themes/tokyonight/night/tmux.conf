# Tokyo Night colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#565f89,bg=default"
set -g status-left "#[fg=#bb9af7]#[fg=#1a1b26,bg=#bb9af7,bold] #{session_name} #[fg=#bb9af7,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#7dcfff,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#1a1b26,bg=#7dcfff"
set -g message-style "fg=#1a1b26,bg=#7dcfff,fill=#7dcfff"
set -g message-command-style "fg=#1a1b26,bg=#7dcfff,fill=#7dcfff"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#e0af68"
