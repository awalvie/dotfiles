# Twilight colours for tmux, sourced from ~/.tmux.conf.
set -g status-style "fg=#5f5a60,bg=default"
set -g status-left "#[fg=#cda869]#[fg=#141414,bg=#cda869,bold] #{session_name} #[fg=#cda869,bg=default,nobold]  ┃  "
setw -g window-status-current-format "#[fg=#7587a6,bold]#I #W#{?window_zoomed_flag, Z,}"
set -g mode-style "fg=#141414,bg=#7587a6"
set -g message-style "fg=#141414,bg=#7587a6,fill=#7587a6"
set -g message-command-style "fg=#141414,bg=#7587a6,fill=#7587a6"
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#f9ee98"
