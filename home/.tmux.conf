# New panes use the nix zsh. The stable nix-profile link survives GC; without
# this, tmux uses the $SHELL the server started under.
set -g default-shell "${HOME}/.nix-profile/bin/zsh"

# True colour, extended keys (Ctrl+Enter and more) and focus events for nvim,
# and a short escape delay.
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB:extkeys,xterm*:RGB"
# Send modified keys such as Shift+Enter to every app, so Shift+Enter makes a
# new line in Claude Code.
set -s extended-keys always
set -s extended-keys-format csi-u
set -s escape-time 10
set -g focus-events on

set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
# Closing a session moves to another session instead of leaving tmux.
set -g detach-on-destroy off
set -g display-time 1500
setw -g aggressive-resize on

# Prefix is `.
unbind C-b
set -g prefix `
bind ` last-window
bind e send-prefix

# Vim keys: copy mode, pane moves, pane resize.
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h resize-pane -L 3
bind -r C-j resize-pane -D 3
bind -r C-k resize-pane -U 3
bind -r C-l resize-pane -R 3

# Kill without confirmation.
bind & kill-window
bind x kill-pane
bind * kill-session

bind C-p previous-window
bind C-n next-window
bind J command-prompt -p "join pane from:" "join-pane -s '%%'"
bind C-x setw synchronize-panes
bind S command-prompt -p "new session:" "new-session -s '%%'"
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# New windows and splits open in the current directory.
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Clipboard: y and mouse drag copy with copy-command; apps inside tmux (nvim)
# can also write the outer clipboard with OSC 52.
set -ga update-environment WAYLAND_DISPLAY
if-shell 'uname | grep -q Darwin' \
  "set -s copy-command 'pbcopy'" \
  "set -s copy-command 'wl-copy'"
set -g set-clipboard on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Status bar on top: the session as a round pill (Nerd Font half circles),
# a divider, then the windows. The colours come from the current theme variant.
set -g status-position top
set -g status-left-length 40
set -g status-right "%b %_d | %H:%M"
setw -g window-status-separator "   "
setw -g window-status-format "#I #W#{?window_zoomed_flag, Z,}"

# Pane borders: each pane has a top border line, which is also the separator
# under the tabs. With the indicators off the whole active border is one colour.
set -g pane-border-lines heavy
set -g pane-border-indicators off
set -g pane-border-status top
set -g pane-border-format ""

# Colours of the current theme variant; skipped while the link is missing.
source-file -q ~/.local/state/theme/current/tmux.conf
