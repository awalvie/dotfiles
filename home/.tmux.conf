# New panes use the nix zsh. The stable nix-profile link survives GC; without
# this, tmux uses the $SHELL the server started under.
set -g default-shell "${HOME}/.nix-profile/bin/zsh"

# True colour for nvim, and no escape lag.
set -g default-terminal "$TERM"
set -ag terminal-overrides ",$TERM:Tc"
set -sg escape-time 20

set -g history-limit 5000
set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g set-titles on
setw -g monitor-activity on

# Prefix is `.
unbind C-b
set -g prefix `
bind ` last-window
bind e send-prefix

# Vim keys: copy mode, pane moves, pane resize.
setw -g mode-keys vi
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h resize-pane -L 3
bind -r C-j resize-pane -D 3
bind -r C-k resize-pane -U 3
bind -r C-l resize-pane -R 3

# Kill without confirmation.
bind & kill-window
bind x kill-pane
bind * kill-session

bind J command-prompt -p "join pane from:" "join-pane -s '%%'"
bind C-x setw synchronize-panes
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# New windows and splits open in the current directory.
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Clipboard: y and mouse drag copy with copy-command; apps inside tmux (nvim)
# can also write the outer clipboard with OSC 52.
set -ga update-environment WAYLAND_DISPLAY
if-shell 'uname | grep -q Darwin' \
  "set -s copy-command 'pbcopy'" \
  "set -s copy-command 'wl-copy'"
set -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Status bar on top, with an empty second line as a gap.
# Colour names follow the terminal palette (Rosé Pine: blue = foam,
# black = overlay); "default" is the terminal background.
set -g status-position top
set -g status 2
set -g status-format[1] ""
set -g status-interval 1
set -g status-style "fg=brightblack,bg=default"
set -g status-left-length 40
set -g status-left "[ #{session_name} ] "
set -g status-right "%b %_d %H:%M | #{user}"
setw -g window-status-separator ""
setw -g window-status-style "fg=blue"
setw -g window-status-activity-style "underscore,fg=blue"
setw -g window-status-format " #I #W #F "
setw -g window-status-current-format "#[fg=brightwhite,bg=black,bold] #I #W #F "

set -g mode-style "fg=black,bg=blue"
set -g message-style "fg=white,bg=black"
set -g message-command-style "fg=white,bg=black"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
