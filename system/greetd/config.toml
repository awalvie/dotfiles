# greetd runs the login screen: tuigreet, a text greeter on the console (no
# compositor). --remember keeps the last user, --remember-session the last
# session; niri is the default.
[terminal]
vt = 1

[default_session]
command = "tuigreet --time --asterisks --remember --remember-session --cmd niri-session"
user = "greeter"
