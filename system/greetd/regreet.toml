# ReGreet, the login screen (see config.toml). The greeter user cannot read the
# home folder, so everything it uses lives in /etc/greetd.
[background]
path = "/var/lib/regreet/background"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
font_name = "Noto Sans 13"
icon_theme_name = "Adwaita"
theme_name = "Adwaita"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[appearance]
greeting_msg = ""

[widget.clock]
format = "%H:%M   %a %d %b"
resolution = "1s"
label_width = 240
